name: more-of-less

# ─── Full-stack More-of-Less Studio ──────────────────────────────────────────
# Usage:
#   1. cp .env.production.example .env.production  && edit it
#   2. docker compose up -d
#   3. Open http://localhost:3000

services:
  mol:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mol
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    volumes:
      - mol-storage:/app/storage
      - mol-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  mol-storage:
    driver: local
  mol-data:
    driver: local
